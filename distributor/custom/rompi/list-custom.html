<script src="https://cdn.datatables.net/1.11.4/js/jquery.dataTables.min.js"></script>
<link href="https://cdn.datatables.net/1.11.4/css/jquery.dataTables.min.css" rel="stylesheet">
<script>
    $(document).ready(function() {
        $('#example').DataTable();
    });
    var storedData = JSON.parse(localStorage.getItem('customOrderDataMikiHat'));
    console.log(storedData);
    var listOrder = ``;
    if (storedData != null) {
        for (let i = 0; i < storedData.length; i++) {
            listOrder += `
        <tr>
            <td>` + (i + 1) + `</td>
            <td><a href="index.html?id=` + i + `&teks=` + storedData[i].customTeks + `">` + storedData[i].customTeks + `</a></td>
            <td>Bayi</td>
            <td>Gold</td>
            <td><button onclick="removeData(` + i + `)" class="btn btn-outline-danger"><i class="bi bi-trash"></i></button></td>
        </tr>
    `;
        }
    }
    $('#listCustomOrderTable').append(listOrder).html()


    function removeData(indexI, indexJ) {
        if (storedData[indexI].customTeksData.length == 1) {
            storedData.splice(indexI, 1);
            removeLocalStorageData();
        } else {
            storedData[indexI].customTeksData.splice(0, 1);
            removeLocalStorageData();
        }
    }

    function removeLocalStorageData() {
        localStorage.removeItem('customOrderDataMikiHat');
        localStorage.setItem('customOrderDataMikiHat', JSON.stringify(storedData));
        window.location.reload();
    }
</script>

</html>
